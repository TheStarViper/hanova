<!doctype html>
<meta charset="utf-8">
<title>Hanova converter test</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem }
  nav button { padding: .4rem 1rem; border: 1px solid #888; background: none; cursor: pointer }
  nav button.active { background: #222; color: #fff }
  section { display: none; margin-top: 1rem }
  section.active { display: block }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .5rem }
  img, video, audio { max-width: 100%; display: none; margin-top: .5rem }
  pre { background: #f4f4f4; padding: .6rem; max-height: 280px; overflow: auto; white-space: pre-wrap; display: none }
  p[id$="tatus"] { white-space: pre-wrap }
  #docReport { font-family: monospace; font-size: 13px; white-space: pre-wrap }
</style>
<body>
  <h3>Hanova converter test</h3>
  <nav>
    <button data-tab="media" class="active">Video / audio</button>
    <button data-tab="images">Images</button>
    <button data-tab="docs">Documents</button>
  </nav>

  <section id="media" class="active">
    <div class="row">
      <input type="file" id="file" accept="video/*,audio/*">
      <select id="target"></select>
      <select id="preset"><option value="">no preset (remux if possible)</option></select>
    </div>
    <div class="row">
      <button id="go">Convert</button>
      <button id="stop">Cancel</button>
    </div>
    <p id="status">Loading...</p>
    <a id="download" style="display:none">Download result</a>
    <video id="preview" controls></video>
    <audio id="audioPreview" controls></audio>
  </section>

  <section id="images">
    <div class="row">
      <input type="file" id="imgFile" accept="image/*,.svg,.tga,.hdr,.psd,.exr,.qoi,.jxl,.avif,.ico,.tif,.tiff">
      <select id="imgTarget"></select>
      <label>quality <input type="range" id="imgQuality" min="1" max="100" value="80"> <span id="imgQ">80</span></label>
    </div>
    <div class="row"><button id="imgGo">Convert</button></div>
    <p id="imgStatus">Loading...</p>
    <a id="imgDownload" style="display:none">Download result</a>
    <img id="imgPreview" alt="">
  </section>

  <section id="docs">
    <div class="row">
      <input type="file" id="docFile">
      <label>from <select id="docFrom"><option value="">auto (from the file name)</option></select></label>
      <label>to <select id="docTarget"></select></label>
    </div>
    <div class="row">
      <button id="docGo">Convert</button>
      <button id="docAll">Test all outputs</button>
    </div>
    <p id="docStatus">Loading...</p>
    <a id="docDownload" style="display:none">Download result</a>
    <pre id="docPreview"></pre>
    <div id="docReport"></div>
  </section>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const fmtMB = (n) => (n / 1e6).toFixed(2);
    const say = (msg) => { $('status').textContent = msg; };
    const imgSay = (msg) => { $('imgStatus').textContent = msg; };
    const docSay = (msg) => { $('docStatus').textContent = msg; };
    const describe = (err) => {
      console.error(err.cause ?? err);
      return `Error${err.code ? ' [' + err.code + ']' : ''}${err.step ? ' (' + err.step + ')' : ''}: ${err.message}`;
    };

    // tabs
    document.querySelectorAll('nav button').forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll('nav button, section').forEach((el) => el.classList.remove('active'));
        b.classList.add('active');
        $(b.dataset.tab).classList.add('active');
      };
    });

    window.addEventListener('error', (e) => say('Error: ' + e.message));
    window.addEventListener('unhandledrejection', (e) => say('Error: ' + (e.reason?.message ?? e.reason)));

    // one setup, then everything goes through hanova.convert
    let hanova;
    try {
      const { initMagick } = await import('../src/bridge/browserMagick.mjs');   // adjust if it lives elsewhere
      await initMagick();
      const mod = await import('../src/bridge/orchestrator.mjs');
      hanova = {
        ...(await mod.universalFactory()),
        MEDIA_INFO: mod.MEDIA_INFO,
        MEDIA_PRESETS: mod.MEDIA_PRESETS,
        DOC_FORMATS: mod.DOC_FORMATS,
        format_from_filename: mod.format_from_filename,
      };
      const caps = hanova.capabilities();

      for (const f of [...caps.video.outputs, ...caps.audio.outputs]) $('target').add(new Option(f, f));
      for (const p of hanova.MEDIA_PRESETS) $('preset').add(new Option(p, p));
      for (const f of caps.image.outputs) $('imgTarget').add(new Option(f, f));
      for (const f of caps.document.inputs) $('docFrom').add(new Option(f, f));
      for (const f of caps.document.outputs) $('docTarget').add(new Option(f, f));

      $('target').value = 'mkv';
      $('imgTarget').value = 'jpg';
      $('docTarget').value = 'html';
      say('Ready. Pick a file.');
      imgSay('Ready. Pick an image.');
      docSay(`Ready. ${caps.document.inputs.length} input and ${caps.document.outputs.length} output formats.`);
    } catch (err) {
      const msg = 'Failed to load: ' + err.message + '\n' + (err.stack ?? '').split('\n').slice(0, 4).join('\n');
      say(msg); imgSay(msg); docSay(msg);
      console.error(err);
    }

    // ---------- media ----------
    const PLAYABLE = ['mp4', 'webm', 'mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a'];
    let ctrl = null;
    $('stop').onclick = () => ctrl?.abort();

    $('go').onclick = async () => {
      const file = $('file').files[0];
      if (!file) { say('Pick a file first.'); return; }
      const target = $('target').value;
      const info = hanova.MEDIA_INFO[target];

      $('download').style.display = 'none';
      $('preview').style.display = 'none';
      $('audioPreview').style.display = 'none';
      ctrl = new AbortController();

      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const t0 = performance.now();
        say('Converting... 0%');
        const out = await hanova.convert(bytes, target, {
          preset: $('preset').value || undefined,
          signal: ctrl.signal,
          onProgress: (p) => say(`Converting... ${Math.round(p * 100)}%`),
        });
        const url = URL.createObjectURL(new Blob([out], { type: info.mime }));
        say(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s: ${fmtMB(bytes.length)} MB -> ${fmtMB(out.length)} MB`);
        $('download').href = url;
        $('download').download = `converted.${info.ext}`;
        $('download').style.display = 'inline';
        if (PLAYABLE.includes(target)) {
          const el = info.video ? $('preview') : $('audioPreview');
          el.src = url;
          el.style.display = 'block';
        }
      } catch (err) {
        say(describe(err));
      }
    };

    // ---------- images ----------
    const IMG_MIME = {
      png: 'image/png', jpg: 'image/jpeg', bmp: 'image/bmp', gif: 'image/gif', webp: 'image/webp',
      avif: 'image/avif', ico: 'image/x-icon', tiff: 'image/tiff', tga: 'image/x-tga',
      hdr: 'image/vnd.radiance', jxl: 'image/jxl', qoi: 'image/qoi', psd: 'image/vnd.adobe.photoshop',
      exr: 'image/x-exr', pdf: 'application/pdf', eps: 'application/postscript', ai: 'application/postscript',
    };
    const IMG_PREVIEW = ['png', 'jpg', 'bmp', 'gif', 'webp', 'avif', 'ico'];

    $('imgQuality').oninput = () => { $('imgQ').textContent = $('imgQuality').value; };

    $('imgGo').onclick = async () => {
      const file = $('imgFile').files[0];
      if (!file) { imgSay('Pick an image first.'); return; }
      const target = $('imgTarget').value;

      $('imgDownload').style.display = 'none';
      $('imgPreview').style.display = 'none';

      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const t0 = performance.now();
        imgSay('Converting...');
        const out = await hanova.convert(bytes, target, { quality: Number($('imgQuality').value) });
        const url = URL.createObjectURL(new Blob([out], { type: IMG_MIME[target] ?? 'application/octet-stream' }));
        imgSay(`Done in ${((performance.now() - t0) / 1000).toFixed(2)}s: ${fmtMB(bytes.length)} MB -> ${fmtMB(out.length)} MB`);
        $('imgDownload').href = url;
        $('imgDownload').download = `converted.${target}`;
        $('imgDownload').style.display = 'inline';
        if (IMG_PREVIEW.includes(target)) {
          $('imgPreview').src = url;
          $('imgPreview').style.display = 'block';
        }
      } catch (err) {
        imgSay(describe(err));
      }
    };

    // ---------- documents ----------
    const fileFormat = (file) => $('docFrom').value || hanova.format_from_filename(file.name);

    function showDoc(out, target) {
      const spec = hanova.DOC_FORMATS[target];
      const url = URL.createObjectURL(new Blob([out], { type: spec.mime ?? 'text/plain' }));
      $('docDownload').href = url;
      $('docDownload').download = `converted.${target}`;
      $('docDownload').style.display = 'inline';
      if (!spec.binary) {
        const text = new TextDecoder().decode(out);
        $('docPreview').textContent = text.length > 6000 ? text.slice(0, 6000) + '\n...' : text;
        $('docPreview').style.display = 'block';
      }
    }

    $('docGo').onclick = async () => {
      const file = $('docFile').files[0];
      if (!file) { docSay('Pick a file first.'); return; }
      const target = $('docTarget').value;

      $('docDownload').style.display = 'none';
      $('docPreview').style.display = 'none';
      $('docReport').textContent = '';

      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const t0 = performance.now();
        docSay('Converting... (the first one downloads about 15 MB of Pandoc)');
        const out = await hanova.convert(bytes, target, { from: fileFormat(file) });
        docSay(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s: ${bytes.length} B -> ${out.length} B`);
        showDoc(out, target);
      } catch (err) {
        docSay(describe(err));
      }
    };

    // converts one small markdown sample into every output format
    const SAMPLE = `# Hello\n\nA *short* sample with **bold**, a [link](https://example.com), and a list:\n\n- one\n- two\n\n| a | b |\n|---|---|\n| 1 | 2 |\n`;

    $('docAll').onclick = async () => {
      $('docDownload').style.display = 'none';
      $('docPreview').style.display = 'none';
      const bytes = new TextEncoder().encode(SAMPLE);
      const outputs = hanova.capabilities().document.outputs.filter((f) => f !== 'md');
      const lines = [];
      let ok = 0;

      for (let i = 0; i < outputs.length; i++) {
        const target = outputs[i];
        docSay(`Testing ${target} (${i + 1}/${outputs.length})...`);
        try {
          const out = await hanova.convert(bytes, target, { from: 'md' });
          lines.push(`ok    ${target.padEnd(9)} ${out.length} B`);
          ok++;
        } catch (err) {
          lines.push(`FAIL  ${target.padEnd(9)} ${err.cause?.message ?? err.message}`.slice(0, 160));
        }
        $('docReport').textContent = lines.join('\n');
      }
      docSay(`Done: ${ok} of ${outputs.length} outputs worked.`);
    };
  </script>
</body>
