<!doctype html>
<meta charset="utf-8">
<title>Mediabunny web test</title>
<body style="font-family: sans-serif; max-width: 640px; margin: 2rem auto">
  <h3>Mediabunny web test</h3>
  <input type="file" id="file" accept="video/*,audio/*">
  <select id="target">
    <option value="mkv">mkv (remux)</option>
    <option value="mp4">mp4</option>
    <option value="webm">webm (re-encode)</option>
  </select>
  <button id="go">Convert</button>
  <p id="status">Pick a file.</p>
  <a id="download" style="display:none">Download result</a>
  <video id="preview" controls style="width:100%; display:none"></video>

  <script type="module">
    import { convert_media } from './backend/src/bridge/mediabunny-bridge.mjs';

    const $ = (id) => document.getElementById(id);

    $('go').onclick = async () => {
      const file = $('file').files[0];
      if (!file) { $('status').textContent = 'Pick a file first.'; return; }

      const target = $('target').value;
      $('status').textContent = 'Converting...';
      $('download').style.display = 'none';
      $('preview').style.display = 'none';

      try {
        const t0 = performance.now();
        const bytes = new Uint8Array(await file.arrayBuffer());
        const out = await convert_media(bytes, target);
        const secs = ((performance.now() - t0) / 1000).toFixed(1);

        const mime = { mkv: 'video/x-matroska', mp4: 'video/mp4', webm: 'video/webm' }[target];
        const url = URL.createObjectURL(new Blob([out], { type: mime }));

        $('status').textContent = `Done in ${secs}s: ${(bytes.length / 1e6).toFixed(1)} MB -> ${(out.length / 1e6).toFixed(1)} MB`;
        $('download').href = url;
        $('download').download = `converted.${target}`;
        $('download').style.display = 'inline';

        if (target !== 'mkv') {          // browsers can't play mkv natively
          $('preview').src = url;
          $('preview').style.display = 'block';
        }
      } catch (err) {
        $('status').textContent = 'Error: ' + (err?.message ?? err);
        console.error(err);
      }
    };
  </script>
</body>
