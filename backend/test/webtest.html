<!doctype html>
<meta charset="utf-8">
<title>Hanova converter test</title>
<style>
  body { font-family: sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem }
  nav button { padding: .4rem 1rem; border: 1px solid #888; background: none; cursor: pointer }
  nav button.active { background: #222; color: #fff }
  section { display: none; margin-top: 1rem }
  section.active { display: block }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .5rem }
  img, video, audio { max-width: 100%; display: none; margin-top: .5rem }
</style>
<body>
  <h3>Hanova converter test</h3>
  <nav>
    <button data-tab="media" class="active">Video / audio (browser)</button>
    <button data-tab="images">Images (server)</button>
  </nav>

  <section id="media" class="active">
    <div class="row">
      <input type="file" id="file" accept="video/*,audio/*">
      <select id="target"></select>
      <select id="preset"><option value="">no preset (remux if possible)</option></select>
    </div>
    <div class="row">
      <button id="go">Convert</button>
      <button id="stop">Cancel</button>
    </div>
    <p id="status">Loading...</p>
    <a id="download" style="display:none">Download result</a>
    <video id="preview" controls></video>
    <audio id="audioPreview" controls></audio>
  </section>

  <section id="images">
    <div class="row">
      <input type="file" id="imgFile" accept="image/*,.svg,.tga,.hdr,.psd,.exr,.qoi,.jxl,.avif,.ico,.tif,.tiff">
      <select id="imgTarget"></select>
      <label>quality <input type="range" id="imgQuality" min="1" max="100" value="80"> <span id="imgQ">80</span></label>
    </div>
    <div class="row"><button id="imgGo">Convert</button></div>
    <p id="imgStatus">Open this tab to load the image engine.</p>
    <a id="imgDownload" style="display:none">Download result</a>
    <img id="imgPreview" alt="">
  </section>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const fmtMB = (n) => (n / 1e6).toFixed(2);

    // ---------- tabs ----------
    let imagesLoaded = false;
    document.querySelectorAll('nav button').forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll('nav button, section').forEach((el) => el.classList.remove('active'));
        b.classList.add('active');
        $(b.dataset.tab).classList.add('active');
        if (b.dataset.tab === 'images' && !imagesLoaded) { imagesLoaded = true; loadImageCaps(); }
      };
    });

    // ---------- media tab: runs in the browser ----------
    const say = (msg) => { $('status').textContent = msg; };
    window.addEventListener('error', (e) => say('Error: ' + e.message));
    window.addEventListener('unhandledrejection', (e) => say('Error: ' + (e.reason?.message ?? e.reason)));

    let bridge;
    try {
      bridge = await import('../src/bridge/mediabunny-bridge.mjs');
      for (const f of bridge.MEDIA_FORMATS) $('target').add(new Option(f, f));
      for (const p of bridge.MEDIA_PRESETS) $('preset').add(new Option(p, p));
      $('target').value = 'mkv';
      say('Ready. Pick a file.');
    } catch (err) {
      say('Failed to load the bridge: ' + err.message);
      console.error(err);
    }

    const PLAYABLE = ['mp4', 'webm', 'mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a'];
    let ctrl = null;
    $('stop').onclick = () => ctrl?.abort();

    $('go').onclick = async () => {
      const file = $('file').files[0];
      if (!file) { say('Pick a file first.'); return; }
      const target = $('target').value;
      const info = bridge.MEDIA_INFO[target];

      $('download').style.display = 'none';
      $('preview').style.display = 'none';
      $('audioPreview').style.display = 'none';
      ctrl = new AbortController();

      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const t0 = performance.now();
        say('Converting... 0%');
        const out = await bridge.convert_media(bytes, target, {
          preset: $('preset').value || undefined,
          signal: ctrl.signal,
          onProgress: (p) => say(`Converting... ${Math.round(p * 100)}%`),
        });
        const url = URL.createObjectURL(new Blob([out], { type: info.mime }));
        say(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s: ${fmtMB(bytes.length)} MB -> ${fmtMB(out.length)} MB`);
        $('download').href = url;
        $('download').download = `converted.${info.ext}`;
        $('download').style.display = 'inline';
        if (PLAYABLE.includes(target)) {
          const el = info.video ? $('preview') : $('audioPreview');
          el.src = url;
          el.style.display = 'block';
        }
      } catch (err) {
        say(`Error${err.code ? ' [' + err.code + ']' : ''}: ${err.message}`);
        console.error(err);
      }
    };

    // ---------- images tab: runs on the Vite dev server ----------
    const IMG_MIME = {
      png: 'image/png', jpg: 'image/jpeg', bmp: 'image/bmp', gif: 'image/gif', webp: 'image/webp',
      avif: 'image/avif', ico: 'image/x-icon', tiff: 'image/tiff', tga: 'image/x-tga',
      hdr: 'image/vnd.radiance', jxl: 'image/jxl', qoi: 'image/qoi', psd: 'image/vnd.adobe.photoshop',
      exr: 'image/x-exr', pdf: 'application/pdf', eps: 'application/postscript', ai: 'application/postscript',
    };
    const IMG_PREVIEW = ['png', 'jpg', 'bmp', 'gif', 'webp', 'avif', 'ico'];
    const imgSay = (msg) => { $('imgStatus').textContent = msg; };

    $('imgQuality').oninput = () => { $('imgQ').textContent = $('imgQuality').value; };

    async function loadImageCaps() {
      imgSay('Loading the image engine (first time loads the WASM)...');
      try {
        const res = await fetch('/api/capabilities');
        const data = await res.json();
        if (!res.ok) throw new Error(data.message ?? res.statusText);
        for (const f of data.image.outputs) $('imgTarget').add(new Option(f, f));
        $('imgTarget').value = 'jpg';
        imgSay(`Ready. ${data.image.outputs.length} output formats.`);
      } catch (err) {
        imgSay('Image engine unavailable: ' + err.message);
      }
    }

    $('imgGo').onclick = async () => {
      const file = $('imgFile').files[0];
      if (!file) { imgSay('Pick an image first.'); return; }
      const target = $('imgTarget').value;
      if (!target) { imgSay('The image engine did not load.'); return; }

      $('imgDownload').style.display = 'none';
      $('imgPreview').style.display = 'none';

      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const t0 = performance.now();
        imgSay('Converting...');

        const res = await fetch(`/api/convert?target=${target}&quality=${$('imgQuality').value}`, {
          method: 'POST',
          body: bytes,
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({ message: res.statusText }));
          throw Object.assign(new Error(e.message), { code: e.code, step: e.step });
        }
        const out = new Uint8Array(await res.arrayBuffer());

        const url = URL.createObjectURL(new Blob([out], { type: IMG_MIME[target] ?? 'application/octet-stream' }));
        imgSay(`Done in ${((performance.now() - t0) / 1000).toFixed(2)}s: ${fmtMB(bytes.length)} MB -> ${fmtMB(out.length)} MB`);
        $('imgDownload').href = url;
        $('imgDownload').download = `converted.${target}`;
        $('imgDownload').style.display = 'inline';
        if (IMG_PREVIEW.includes(target)) {
          $('imgPreview').src = url;
          $('imgPreview').style.display = 'block';
        }
      } catch (err) {
        imgSay(`Error${err.code ? ' [' + err.code + ']' : ''}${err.step ? ' (' + err.step + ')' : ''}: ${err.message}`);
        console.error(err);
      }
    };
  </script>
</body>
